name: Deploy to EC2

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lead-gen-api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY \
            || aws ecr create-repository --repository-name $ECR_REPOSITORY

      - name: Build and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "ecr_registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/ec2-key.pem > /dev/null && echo "Key is valid" || (echo "Key is INVALID — check EC2_SSH_KEY secret" && exit 1)

      - name: Copy compose file to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@$EC2_HOST "mkdir -p /home/ubuntu/lead-gen"
          scp -i ~/.ssh/ec2-key.pem docker-compose.aws.yml ubuntu@$EC2_HOST:/home/ubuntu/lead-gen/

      - name: Ensure swap on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem ubuntu@$EC2_HOST bash -s << 'ENDSSH'
            if ! swapon --show | grep -q /swapfile; then
              sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              echo "vm.swappiness=10" | sudo tee -a /etc/sysctl.conf
              sudo sysctl -p
              echo "Swap created: $(swapon --show)"
            else
              echo "Swap already active: $(swapon --show)"
            fi
          ENDSSH

      - name: Deploy on EC2
        env:
          ECR_REGISTRY: ${{ steps.build.outputs.ecr_registry }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          ECR_IMAGE=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest
          ssh -i ~/.ssh/ec2-key.pem ubuntu@$EC2_HOST \
            ECR_PASSWORD="$ECR_PASSWORD" ECR_REGISTRY="$ECR_REGISTRY" ECR_IMAGE="$ECR_IMAGE" \
            bash -s << 'ENDSSH'
              set -e
              echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
              mkdir -p /home/ubuntu/lead-gen
              cd /home/ubuntu/lead-gen
              docker compose -f docker-compose.aws.yml down --remove-orphans || true
              docker stop $(docker ps -q) 2>/dev/null || true
              docker rm $(docker ps -aq) 2>/dev/null || true
              ECR_IMAGE="$ECR_IMAGE" docker compose -f docker-compose.aws.yml up -d --scale chrome-node=4
              docker image prune -f
          ENDSSH
