<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Gen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-7xl mx-auto py-8 px-4">
        <header class="mb-10">
            <h1 class="text-3xl font-bold text-gray-900">Lead Generation Control Center</h1>
            <p class="text-gray-600">Configure, run, and manage your scraping jobs.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Config Panel -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <h2 class="text-xl font-semibold mb-4">Start New Job</h2>
                <form id="scrapeForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">State</label>
                        <input type="text" id="state" name="state" value="Missouri" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Cities (comma separated)</label>
                        <textarea id="cities" name="cities" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border" rows="3">Lee's Summit, St. Joseph</textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Base Query</label>
                        <input type="text" id="base_query" name="base_query" value="medical malpractice and personal injury lawyers" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Target per City</label>
                        <input type="number" id="target" name="target" value="10" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                        Launch Scraper
                    </button>
                </form>
            </div>

            <!-- Status & Results Panel -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Active Jobs Section -->
                <div id="activeJobsContainer" class="bg-blue-50 p-6 rounded-xl border border-blue-200 hidden">
                    <h2 class="text-xl font-semibold text-blue-800 mb-4">Active Operations</h2>
                    <div id="activeJobsList" class="space-y-3">
                        <!-- Active jobs injected here -->
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">Generated Files</h2>
                        <div class="flex gap-4">
                            <button onclick="consolidateLeads()" class="bg-green-50 text-green-700 px-3 py-1 rounded border border-green-200 hover:bg-green-100 transition text-sm font-medium">Consolidate All</button>
                            <button onclick="loadFiles()" class="text-sm text-blue-600 hover:underline">Refresh</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">File Name</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="fileList" class="bg-white divide-y divide-gray-200">
                                <!-- Files populated here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Data Preview -->
                <div id="previewContainer" class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 hidden">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold" id="previewTitle">Data Preview</h2>
                        <button onclick="closePreview()" class="text-gray-400 hover:text-gray-600">✕</button>
                    </div>
                    <div class="overflow-x-auto max-h-96">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50" id="tableHeader"></thead>
                            <tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('scrapeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                state: formData.get('state'),
                cities: formData.get('cities').split(',').map(c => c.trim()),
                base_query: formData.get('base_query'),
                target: parseInt(formData.get('target'))
            };

            const res = await fetch('/jobs/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert('Job Started: ' + result.job_id);
            loadFiles();
            loadActiveJobs();
        });

        async function loadActiveJobs() {
            const res = await fetch('/jobs/active');
            const jobs = await res.json();
            const container = document.getElementById('activeJobsContainer');
            const list = document.getElementById('activeJobsList');
            
            const jobIds = Object.keys(jobs);
            if (jobIds.length === 0) {
                container.classList.add('hidden');
                return;
            }

            container.classList.remove('hidden');
            list.innerHTML = jobIds.map(id => {
                const job = jobs[id];
                return `
                    <div class="bg-white p-3 rounded border border-blue-100 shadow-sm">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="font-bold text-blue-700">Processing: ${job.city}, ${job.state}</span>
                            <span class="text-gray-500 text-xs">ID: ${id.substring(0,8)}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-xs text-center">
                            <div class="bg-gray-50 p-1 rounded">Firms: ${job.queues.firms}</div>
                            <div class="bg-gray-50 p-1 rounded">Profiles: ${job.queues.profiles}</div>
                            <div class="bg-gray-50 p-1 rounded">Pending: ${job.queues.results}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function consolidateLeads() {
            const res = await fetch('/results/consolidate', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            loadFiles();
        }

        async function loadFiles() {
            const res = await fetch('/results');
            const data = await res.json();
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            
            data.files.forEach(file => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${file.split('/').pop()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="viewFile('${file}')" class="text-blue-600 hover:text-blue-900 mr-4">View</button>
                        <a href="/results/download?path=${file}" class="text-green-600 hover:text-green-900">Download</a>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        async function viewFile(path) {
            const res = await fetch(`/results/view?path=${path}`);
            const data = await res.json();
            if (data.length === 0) return;

            const container = document.getElementById('previewContainer');
            const header = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');
            document.getElementById('previewTitle').innerText = path.split('/').pop();
            
            header.innerHTML = '<tr>' + Object.keys(data[0]).map(k => `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">${k}</th>`).join('') + '</tr>';
            body.innerHTML = data.map(row => '<tr>' + Object.values(row).map(v => `<td class="px-6 py-4 whitespace-nowrap text-gray-600 border-b">${v}</td>`).join('') + '</tr>').join('');
            
            container.classList.remove('hidden');
        }

        function closePreview() {
            document.getElementById('previewContainer').classList.add('hidden');
        }

        loadFiles();
        setInterval(loadFiles, 10000); 
        setInterval(loadActiveJobs, 3000); 
    </script>
</body>
</html>
