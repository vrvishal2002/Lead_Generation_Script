logoutput: /var/log/danted.log

# Listen on all interfaces on port 1080
internal: 0.0.0.0 port = 1080

# Use the VPS public IP for outgoing connections
external: 166.0.192.58

# No authentication required for this setup
clientmethod: none
socksmethod: none

# Define users
user.privileged: root
user.unprivileged: nobody

# Allow connections from any IP address
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

# Allow traffic to flow from any IP to the internet via the proxy
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}
